[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "duplicate-detector"
dynamic = ["version"]
description = "A read-only desktop tool that finds duplicate files and similar photos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gopal Thakur" }]
keywords = ["duplicates", "duplicate-files", "sha256", "phash", "file-management", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=13.0", "ImageHash>=4.3.2"]

[project.urls]
Homepage = "https://github.com/gopalthakur71/duplicate-detector"
Issues = "https://github.com/gopalthakur71/duplicate-detector/issues"
Changelog = "https://github.com/gopalthakur71/duplicate-detector/blob/main/CHANGELOG.md"

[project.scripts]
duplicate-detector = "duplicate_detector.cli:main"

[project.gui-scripts]
duplicate-detector-gui = "duplicate_detector.gui:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17.5",
    "mypy>=2.4",
    "pre-commit>=4.7",
]

[tool.hatch.version]
path = "src/duplicate_detector/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.pre-commit-config.yaml"]

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PIE",
    "PT",      # pytest style
    "RET",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters like "…" in UI text

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["imagehash", "imagehash.*"]
ignore_missing_imports = true

# Several ttk methods (Notebook.tab/select/index) are unannotated in typeshed.
[[tool.mypy.overrides]]
module = ["duplicate_detector.gui", "tests.test_gui"]
disallow_untyped_calls = false

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["duplicate_detector"]
branch = true
omit = ["*/duplicate_detector/gui.py", "*/duplicate_detector/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
