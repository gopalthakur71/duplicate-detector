name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: >-
            I understand this tool is deliberately read-only. Requests that delete or
            move files need a clear safety design (e.g. Recycle Bin only, confirmation).
