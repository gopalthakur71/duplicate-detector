name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: >-
            I understand deletion must stay user-driven: files are only removed after the user
            selects them and confirms, and only to the Recycle Bin.
